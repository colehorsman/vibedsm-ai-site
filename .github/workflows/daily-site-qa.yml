name: daily-site-qa

on:
  schedule:
    - cron: '15 13 * * *' # daily 8:15am America/Chicago (approx UTC, adjust DST if needed)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  qa:
    environment: 12769332225
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run site QA
        env:
          SITE_URL: https://vibedsm.ai
        run: npm run qa:site

      - name: Create/Update security issue when findings exist
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'qa-reports/site-qa-report.json';
            if (!fs.existsSync(path)) {
              core.info('No QA report found; skipping issue automation.');
              return;
            }

            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const secWarnings = report.categories?.security?.warnings || [];
            const linkFails = report.categories?.links?.failed || [];
            const consoleErrors = report.categories?.errors?.console || [];
            const pageErrors = report.categories?.errors?.page || [];

            const hasSecurity = secWarnings.length > 0;
            if (!hasSecurity) {
              core.info('No security findings; skipping security issue creation.');
              return;
            }

            const title = `[QA][Security] ${secWarnings.length} security finding(s) on ${report.site}`;
            const body = [
              `Automated daily QA detected security findings.`,
              '',
              `- Site: ${report.site}`,
              `- Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Security warnings: ${secWarnings.length}`,
              `- Link failures: ${linkFails.length}`,
              `- Console errors: ${consoleErrors.length}`,
              `- Page errors: ${pageErrors.length}`,
              '',
              '## Security findings',
              ...secWarnings.map(w => `- ${w}`),
              '',
              'Owner recommendation: route to security agent (`red-team`) for triage and remediation PR.'
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated-qa'
            });

            const existing = openIssues.find(i => i.title.startsWith('[QA][Security]'));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.info(`Updated existing security issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'automated-qa']
              });
              core.info(`Created security issue #${created.data.number}`);
            }

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-site-qa-report
          path: qa-reports/*

      - name: Post QA summary to Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request

          report_path = pathlib.Path('qa-reports/site-qa-report.json')
          if not report_path.exists():
            print('No report found; skipping Slack post')
            raise SystemExit(0)

          r = json.loads(report_path.read_text())
          links_checked = r['categories']['links']['checked']
          links_failed = len(r['categories']['links']['failed'])
          console_errors = len(r['categories']['errors']['console'])
          page_errors = len(r['categories']['errors']['page'])
          sec_warn = len(r['categories']['security']['warnings'])
          analytics = r['categories']['analytics']['detected']

          status = '✅ PASS'
          if links_failed or console_errors or page_errors or sec_warn:
            status = '⚠️ NEEDS REVIEW'

          text = (
            f"*vibeDSM Daily QA* — {status}\n"
            f"• Site: {r['site']}\n"
            f"• Links: {links_checked} checked, {links_failed} failed\n"
            f"• Errors: {console_errors} console, {page_errors} page\n"
            f"• Security warnings: {sec_warn}\n"
            f"• Analytics detected: {'yes' if analytics else 'no'}\n"
            f"• Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )

          payload = json.dumps({'text': text}).encode('utf-8')
          req = urllib.request.Request(
            os.environ['SLACK_WEBHOOK_URL'],
            data=payload,
            headers={'Content-Type':'application/json'}
          )
          with urllib.request.urlopen(req) as resp:
            print('Slack post status:', resp.status)
          PY
