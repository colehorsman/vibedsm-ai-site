name: daily-site-qa

on:
  schedule:
    - cron: '15 13 * * *' # daily 8:15am America/Chicago (approx UTC, adjust DST if needed)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  qa:
    environment: 12769332225
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run site QA
        env:
          SITE_URL: https://vibedsm.ai
        run: npm run qa:site

      - name: Create/Update QA issues when findings exist
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'qa-reports/site-qa-report.json';
            if (!fs.existsSync(path)) {
              core.info('No QA report found; skipping issue automation.');
              return;
            }

            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const secWarnings = report.categories?.security?.warnings || [];
            const linkFails = report.categories?.links?.failed || [];
            const consoleErrors = report.categories?.errors?.console || [];
            const pageErrors = report.categories?.errors?.page || [];

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            async function upsertIssue({prefix, labels, title, body}) {
              const { data: openIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open'
              });
              const existing = openIssues.find(i => i.title.startsWith(prefix));
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body
                });
                core.info(`Updated existing issue #${existing.number} (${prefix})`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels
                });
                core.info(`Created issue #${created.data.number} (${prefix})`);
              }
            }

            if (secWarnings.length > 0) {
              const title = `[QA][Security] ${secWarnings.length} finding(s) on ${report.site}`;
              const body = [
                `Automated daily QA detected security findings.`,
                '',
                `- Site: ${report.site}`,
                `- Run: ${runUrl}`,
                `- Security warnings: ${secWarnings.length}`,
                '',
                '## Security findings',
                ...secWarnings.map(w => `- ${w}`),
                '',
                'Route: security agent (`red-team`) triage + remediation PR.'
              ].join('\n');
              await upsertIssue({
                prefix: '[QA][Security]',
                labels: ['security', 'automated-qa'],
                title,
                body
              });
            } else {
              core.info('No security findings.');
            }

            const reliabilityCount = linkFails.length + consoleErrors.length + pageErrors.length;
            if (reliabilityCount > 0) {
              const title = `[QA][Reliability] ${reliabilityCount} issue(s) on ${report.site}`;
              const body = [
                `Automated daily QA detected reliability issues.`,
                '',
                `- Site: ${report.site}`,
                `- Run: ${runUrl}`,
                `- Link failures: ${linkFails.length}`,
                `- Console errors: ${consoleErrors.length}`,
                `- Page errors: ${pageErrors.length}`,
                '',
                '## Link failures',
                ...(linkFails.length ? linkFails.map(x => `- ${x.url} (${x.status})`) : ['- none']),
                '',
                '## Console errors',
                ...(consoleErrors.length ? consoleErrors.map(x => `- ${x.page}: ${x.text}`) : ['- none']),
                '',
                '## Page errors',
                ...(pageErrors.length ? pageErrors.map(x => `- ${x.page}: ${x.text}`) : ['- none']),
                '',
                'Route: dev/content owners triage and remediation PR.'
              ].join('\n');
              await upsertIssue({
                prefix: '[QA][Reliability]',
                labels: ['bug', 'automated-qa'],
                title,
                body
              });
            } else {
              core.info('No reliability findings.');
            }

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-site-qa-report
          path: qa-reports/*

      - name: Post QA summary to Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request

          report_path = pathlib.Path('qa-reports/site-qa-report.json')
          if not report_path.exists():
            print('No report found; skipping Slack post')
            raise SystemExit(0)

          r = json.loads(report_path.read_text())
          links_checked = r['categories']['links']['checked']
          links_failed = len(r['categories']['links']['failed'])
          console_errors = len(r['categories']['errors']['console'])
          page_errors = len(r['categories']['errors']['page'])
          sec_warn = len(r['categories']['security']['warnings'])
          analytics = r['categories']['analytics']['detected']

          status = '✅ PASS'
          if links_failed or console_errors or page_errors or sec_warn:
            status = '⚠️ NEEDS REVIEW'

          text = (
            f"*vibeDSM Daily QA* — {status}\n"
            f"• Site: {r['site']}\n"
            f"• Links: {links_checked} checked, {links_failed} failed\n"
            f"• Errors: {console_errors} console, {page_errors} page\n"
            f"• Security warnings: {sec_warn}\n"
            f"• Analytics detected: {'yes' if analytics else 'no'}\n"
            f"• Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )

          payload = json.dumps({'text': text}).encode('utf-8')
          req = urllib.request.Request(
            os.environ['SLACK_WEBHOOK_URL'],
            data=payload,
            headers={'Content-Type':'application/json'}
          )
          with urllib.request.urlopen(req) as resp:
            print('Slack post status:', resp.status)
          PY
